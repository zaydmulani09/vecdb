[package]
name = "vecdb-core"
version = "0.1.0"
edition = "2021"
description = "Core storage, indexing, and search engine for vecdb — a hybrid vector database"
license = "MIT"
repository = "https://github.com/zaydmulani09/vecdb"
keywords = ["vector-database", "hnsw", "bm25", "hybrid-search", "embedding"]
